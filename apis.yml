name: Arcot Systems
description: Arcot Systems is a payment security and advanced authentication company
  founded in 1997 that co-invented the 3-D Secure protocol with Visa. Its TransFort
  and ArcotID products delivered card-not-present fraud prevention, risk-based
  authentication, and cardholder authentication for online card payments. Accel was
  an early venture investor. CA Technologies acquired Arcot in 2010 in a $200 million
  all-cash transaction, and the technology now ships as the "Arcot by Broadcom"
  payment security and fraud prevention product line at arcot.broadcom.com. It is no
  longer an independent company and publishes no public developer API surface.
